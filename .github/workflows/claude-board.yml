name: Claude Board

# UNICA action economica del setup ibrido:
#   - issue aperta  -> TRIAGE con Haiku (label + tier + ready/needs-info)
#   - PR aperta      -> REVIEW veloce con Sonnet (l'implementazione la lanci
#                       tu in locale con /next-task, non qui)
#   - issue chiusa "completed" -> label status:* sostituita da status:done
#                       (nessun modello Claude, solo `gh issue edit`: costo zero)
#
# Il lavoro pesante (implementazione, review RLS profonda) resta locale in
# Claude Code Desktop: quella parte non deve girare da sola sul cloud.
#
# Prerequisiti:
#   1) secret ANTHROPIC_API_KEY nel repo (Settings → Secrets → Actions)
#      Modo rapido: in Claude Code -> /install-github-app (crea app + secret)
#   2) label create con scripts/setup-board-labels.sh
#   3) i file .claude/agents/*.md committati nel repo

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, ready_for_review]

# Non sprecare run: se arrivano eventi ravvicinati sullo stesso oggetto,
# tieni solo l'ultimo.
concurrency:
  group: claude-board-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # -------------------------------------------------------------------------
  triage:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 8            # guardrail costo: sessione breve
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Haiku: gira spessissimo, deve costare poco.
          # --max-turns limita l'esplorazione (altro guardrail costo).
          # Read/Grep/Glob/Write: triage.md chiede di leggere CLAUDE.md e
          # specs/ e di scrivere il commento in un file prima di pubblicarlo.
          # Senza, ogni tentativo veniva negato e il job finiva i turni a
          # vuoto (issue #77: 8 tentativi negati, $0,10, nessun commento).
          claude_args: >-
            --model claude-haiku-4-5 --max-turns 12
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label list:*)"
          prompt: |
            Agisci come l'agente di TRIAGE definito in .claude/agents/triage.md.
            Oggetto: issue #${{ github.event.issue.number }} di questo repo.
            Segui quel file alla lettera. Sii conciso: un solo commento di triage.

  # -------------------------------------------------------------------------
  review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    # ^ fork-safety: le PR da fork non hanno accesso ai secret (0 crediti spesi).
    # ^ niente review per Dependabot (issue #68, causa 3): claude-code-action
    #   rifiuta gli attori bot, e su un bump di dipendenze la review
    #   qualitativa vale poco — il gate reale è il job `verifica` di ci.yml.
    # ^ draft: niente review finché la PR è in bozza; parte una volta sola,
    #   quando la PR viene segnata pronta (o aperta direttamente non-draft).
    # ^ skip-review: etichetta per le PR banali (solo versione, solo docs).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # serve il diff completo per una review sensata
      # Il diff si prepara qui, gratis, invece di farlo esplorare al modello
      # turno dopo turno. Esclusi i file enormi o generati che non servono
      # alla review e costano token: TASKS.md, l'archivio, il lockfile.
      - name: Prepara il diff della PR
        run: |
          set -eu
          mkdir -p .review
          escludi=(':(exclude)TASKS.md' ':(exclude)docs/tasks-archivio.md' ':(exclude)package-lock.json')
          base="origin/${{ github.base_ref }}"
          {
            echo "# File modificati"
            git diff --stat "$base"...HEAD
            echo
            echo "# Diff (senza TASKS.md, archivio e package-lock.json)"
            git diff "$base"...HEAD -- . "${escludi[@]}"
          } > .review/diff.txt
          wc -c .review/diff.txt
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sonnet: buon rapporto qualità/costo per la review standard.
          # Se la PR tocca RLS/auth/migrazioni, l'agente NON approva e chiede
          # la review locale di rls-guardian (Opus): vedi .claude/agents/reviewer.md
          #
          # Storia di --allowedTools / --max-turns (issue #20): la versione
          # precedente limitava i tool a soli "gh pr/issue *" senza Read/Grep/
          # Glob, mentre reviewer.md richiede di leggere CLAUDE.md, gli scenari
          # in specs/ e i file toccati per giudicare aderenza e qualità. Senza
          # quei tool ogni tentativo di lettura veniva negato (visto nei log:
          # permission_denials_count 11-13 su run reali), l'agente girava a
          # vuoto riprovando strade alternative e finiva comunque con esito
          # "success" ma dopo 22-24 turni — superando il tetto di 15 e facendo
          # fallire il job (l'action tratta lo sforamento di --max-turns come
          # errore anche a compito riuscito), senza mai pubblicare un commento
          # di review (PR #52, #53). Non mancava "gh issue view" per leggere la
          # checklist della issue collegata: aggiunta anche quella.
          #
          # Issue #77 / costi: con 30 turni la review della #76 è costata
          # $0,99 senza pubblicare nulla (16 tentativi negati: git diff e
          # scrittura del commento su file non erano permessi). Ora il diff
          # è già in .review/diff.txt, Write è permesso e il tetto scende a 15.
          claude_args: >-
            --model claude-sonnet-5 --max-turns 15
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*),Bash(gh issue edit:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Agisci come l'agente di REVIEW definito in .claude/agents/reviewer.md.
            Oggetto: PR #${{ github.event.pull_request.number }} di questo repo.
            Il diff è già pronto in .review/diff.txt: leggi quello, non
            ricostruirlo. Apri altri file solo se il diff non basta a
            giudicare (la spec pertinente, un file toccato per contesto).
            Review concisa e azionabile, un solo commento. NON mergiare mai.

  # -------------------------------------------------------------------------
  # Nessun modello Claude: solo `gh issue edit` con il token di default del
  # workflow. Non scatta su "not planned" (issue chiuse senza essere risolte),
  # solo quando GitHub la marca "completed".
  chiusura-issue:
    if: >
      github.event_name == 'issues' && github.event.action == 'closed' &&
      github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Sostituisce le label status:* con status:done
        run: |
          set -eu
          numero="${{ github.event.issue.number }}"
          etichette_status=$(gh issue view "$numero" --json labels -q '.labels[].name' | grep '^status:' || true)
          for etichetta in $etichette_status; do
            if [ "$etichetta" != "status:done" ]; then
              gh issue edit "$numero" --remove-label "$etichetta"
            fi
          done
          gh issue edit "$numero" --add-label status:done
