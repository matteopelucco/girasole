name: Analisi statica

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Codice duplicato (jscpd)
        run: npm run check:dup
