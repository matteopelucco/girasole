name: CI

# Unico workflow di verifica su ogni pull request verso main (A12,
# docs/programma-attivita.md). Tre job (issue #105), un solo check obbligatorio:
#
#   statico ──► e2e ──► verifica
#      └────────────────────┘
#
#   - `statico`  passi 0-5 (classificazione, tsc, lint, jscpd, vitest,
#                next build). Nessun accesso al DB: gira in parallelo tra PR
#                diverse.
#   - `e2e`      pgTAP, grant-check, rls-check, account di test e Playwright
#                contro un Supabase LOCALE acceso nel runner (issue #419,
#                ADR-0012), più una seconda `next build` (serve a `next start`,
#                vedi playwright.config.ts; ~20 s, più semplice e robusto che
#                passare .next tra job come artifact). Nessun segreto,
#                nessuna coda: ogni run ha il proprio database, che sparisce
#                a fine job, quindi le PR girano in parallelo. Giro tipico
#                ~10 minuti. Non parte proprio sulle PR "non codice" e di
#                Dependabot.
#   - `verifica` gate finale, pochi secondi: è il check richiesto dal
#                ruleset di main ("CI / verifica", stesso nome di quando il
#                workflow aveva un solo job — il ruleset non va toccato).
#                Gira sempre (`if: always()`) e fallisce se `statico` non è
#                verde, o se `e2e` doveva girare e non è verde (fallito o
#                cancellato). Passa se `e2e` è stato saltato di proposito.
#                `always()` e non `!cancelled()`: un job richiesto
#                `skipped` conta come verde per il ruleset, quindi con
#                `!cancelled()` un run annullato a mano lascerebbe la PR
#                mergiabile senza CI. Il job non fa checkout né install,
#                quindi non rischia di restare appeso.
#
# Il DB di test remoto (`girasole_dev`) NON è più usato da questo workflow
# (ADR-0012, che supera ADR-0006 e ADR-0008): niente reset, niente coda
# globale `db-test-girasole-dev`. Lo usa solo il giro di fumo sull'anteprima
# (`anteprima-fumo.yml`, ADR-0009), in un proprio gruppo di coda. Nessun altro
# job di questo file tocca un progetto Supabase remoto.
#
# Concurrency, un solo livello: workflow `ci-<numero PR>`,
# `cancel-in-progress: true`: un nuovo push sulla stessa PR cancella l'intero
# run precedente, compreso il suo job `e2e`. Il `verifica` del run cancellato
# diventa rosso sul vecchio commit: irrilevante, il ruleset guarda il check
# del commit di testa. Se un `e2e` viene cancellato senza un run più recente
# (annullo a mano), `verifica` è rosso: "Re-run failed jobs" dalla pagina del
# run, o `gh run rerun <run-id> --failed`.
#
# Issue #98 — PR "non codice" (solo docs/**, specs/**, CLAUDE.md, README.md,
# CHANGELOG.md, o un bump puro di versione in package.json/package-lock.json):
# il workflow parte SEMPRE e il check obbligatorio `verifica` c'è SEMPRE
# (niente `paths`/`paths-ignore`: renderebbero il check "non eseguito"
# invece che "verde", e un check obbligatorio mai eseguito blocca il
# merge). Il passo 0 (`scripts/classifica-pr.mts`, logica pura in
# `lib/pr-classificazione.ts`) espone `is-non-codice-ci`: la build (5) si
# salta con un `if:` sullo step, e il job `e2e` non parte (output
# `serve-e2e` di `statico`). I passi 1-4 (tsc/lint/jscpd/vitest) restano
# SEMPRE attivi: costano pochi secondi e saltarli non farebbe risparmiare
# quasi nulla.
#
# PR di Dependabot (issue #68): il job `e2e` non parte quando l'attore è
# `dependabot[bot]` (stesso output `serve-e2e`). Il motivo originale erano i
# segreti, che quelle run non vedono; il job locale non ne usa, ma il
# comportamento NON è stato cambiato: se far girare l'e2e anche su Dependabot
# e sulle PR esterne è una decisione separata (issue #419). Intanto, quando un
# bump tocca codice sensibile (es. @supabase/ssr) la e2e si fa girare
# rifacendo la PR da una branch umana (come #72/#73). Le due condizioni (non
# codice, Dependabot) restano indipendenti.
#
# Ordine dei passi, dal più veloce/economico al più lento:
#   0. classifica — issue #98, vedi sopra
#   1. tsc      — type-check
#   2. lint     — ESLint (next lint)
#   3. jscpd    — codice duplicato
#   4. vitest   — unit test (nessun I/O, nessun secret)
#   5. next build — la build di produzione, lo stesso bundler di Vercel:
#      è l'unico passo che intercetta un import lato server (next/headers)
#      trascinato in un componente client — il buco esatto di v0.39/v0.40,
#      che tsc/lint/vitest non vedono. Resta in `statico` (anche se `e2e`
#      ricompila) perché fallisca PRIMA di avviare Supabase.
#   Job `e2e`, in ordine: avvio di Supabase locale (migration e seed
#   compresi), build, pgTAP sulle policy RLS, grant-check (A26, issue #28),
#   rls-check (issue #131), account di test E2E_* (A24, password generate a
#   ogni giro), Playwright. Un ruolo E2E_* mancante farebbe solo saltare
#   (test.skip) i test che lo richiedono, ma qui sono sempre tutti impostati.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Se arrivano più push ravvicinati sulla stessa PR, tieni solo l'ultimo run
# (vedi sopra: cancella anche il job `e2e` in corso).
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  statico:
    runs-on: ubuntu-latest
    # Oggi ~1 minuto (npm ci + passi 0-5): 10 è ampio margine.
    timeout-minutes: 10
    outputs:
      # 'true' se il job `e2e` deve girare (PR di codice, non Dependabot).
      serve-e2e: ${{ steps.decidi.outputs.serve-e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia completa (non solo l'ultimo commit) per poter
          # fare `git diff`/`git show` tra base e head nello step 0
          # (issue #98): con il default (shallow) i commit precedenti non
          # sono nel checkout locale del runner.
          fetch-depth: 0

      # 22, non 20: lo script crea-utenti-e2e.mjs (job `e2e`) usa
      # @supabase/supabase-js, che su Node richiede il WebSocket nativo,
      # disponibile solo da Node 22. Lo stesso Node 22+ esegue nativamente
      # anche lo script TypeScript dello step 0 (issue #98).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: "0. Classifica la PR (issue #98)"
        id: classifica
        run: >
          node --no-warnings --experimental-strip-types scripts/classifica-pr.mts
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: 'PR "non codice" — build ed e2e saltati (issue #98)'
        if: steps.classifica.outputs.is-non-codice-ci == 'true'
        run: |
          echo "::notice::PR solo docs/specs/TASKS/README/CHANGELOG o bump di versione — build ed e2e saltate (issue #98)."

      - name: Dependabot — job e2e saltato (decisione invariata, issue #419)
        if: github.actor == 'dependabot[bot]'
        # Blocco "|": in uno scalare YAML non quotato " #68" apre un commento
        # e tronca il comando lasciando la virgoletta aperta (bash: EOF).
        run: |
          echo "::notice::PR di Dependabot — e2e saltata (issue #68). Se il bump tocca codice sensibile, rifare la PR da una branch umana per la CI completa."

      # Decide qui, una volta sola, se il job `e2e` deve partire: il suo
      # `if:` a livello di job legge questo output. Valori da variabili
      # d'ambiente, non interpolati nello script.
      - name: "Decidi se serve la e2e (issue #105)"
        id: decidi
        env:
          NON_CODICE: ${{ steps.classifica.outputs.is-non-codice-ci }}
          ATTORE: ${{ github.actor }}
        run: |
          if [ "$NON_CODICE" = "true" ] || [ "$ATTORE" = "dependabot[bot]" ]; then
            echo "serve-e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "serve-e2e=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 1. Type-check (tsc)
        # `next typegen` crea next-env.d.ts e .next/types (non versionati):
        # senza, tsc non li trova su un clone pulito.
        run: npx next typegen && npx tsc --noEmit

      - name: 2. Lint (ESLint)
        run: npm run lint

      - name: 3. Codice duplicato (jscpd)
        run: npm run check:dup

      - name: 4. Unit test (Vitest)
        run: npm run test:unit

      - name: 5. Build di produzione (next build)
        if: steps.classifica.outputs.is-non-codice-ci != 'true'
        run: npm run build
        env:
          # Le NEXT_PUBLIC_* vengono inlinate nel bundle client in fase di
          # build (come su Vercel): sono le chiavi del progetto di test.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # Controlli sul DB: pgTAP, grant-check, rls-check, account di test e
  # Playwright contro una copia di Supabase accesa nel runner (Docker), che
  # nasce e muore con il job (issue #419, ADR-0012). Nessun segreto, nessuna
  # variabile del repository, nessuna coda: ogni run ha il suo database, quindi
  # i run di PR diverse possono girare in parallelo. Non tocca nessun progetto
  # Supabase vero. Il giro tipico dura ~10 minuti: 25 sono ampio margine.
  e2e:
    needs: statico
    # Nessuna funzione di stato nell'espressione: GitHub aggiunge success(),
    # quindi parte solo se `statico` è verde E la PR richiede la e2e.
    if: needs.statico.outputs.serve-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EMAIL_DRY_RUN: '1'
      CRON_SECRET: ci-e2e-cron-secret
      ROJAC_EMAIL_DESTINATARIO: rojac-e2e@example.com
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_MAESTRA_EMAIL: e2e-maestra@example.com
      E2E_ASSISTENTE_EMAIL: e2e-assistente@example.com
      E2E_GENITORE_EMAIL: e2e-genitore@example.com
      E2E_MAESTRA_SENZA_SEZIONE_EMAIL: e2e-maestra-senza-sezione@example.com
      E2E_UTENTE_DA_PROMUOVERE_EMAIL: e2e-da-promuovere@example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Installa Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # Applica anche migration e seed. Esclusi i servizi che l'app non usa:
      # restano database, accesso (gotrue), API (postgrest, kong) e posta (mailpit).
      # Prima migration, solo in questo runner: i privilegi di default come sul
      # servizio ospitato (vedi il commento nel file).
      - name: Avvia Supabase locale
        run: |
          cp supabase/ci/privilegi-default-ospitato.sql supabase/migrations/0000_privilegi_default_ospitato.sql
          npm install -g supabase@3.0.0
          # Fino a 3 tentativi: lo scaricamento delle immagini può essere
          # rifiutato per un limite temporaneo del registro e lasciare container
          # a metà (porta già in uso al giro dopo), quindi si ripulisce e si riprova.
          for tentativo in 1 2 3; do
            if supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::Avvio di Supabase locale fallito (tentativo $tentativo di 3)"
            supabase stop --no-backup || true
            docker rm -f $(docker ps -aq --filter "name=supabase_") 2>/dev/null || true
            sleep $((tentativo * 20))
          done
          exit 1

      # Indirizzo e chiavi dimostrative dello stack locale (non sono segreti);
      # le password degli account di test si generano a ogni giro.
      - name: Prepara l'ambiente locale
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          leggi() { grep -E "^$1=" "$RUNNER_TEMP/supabase.env" | head -n 1 | cut -d= -f2- | tr -d '"'; }
          API_URL="$(leggi API_URL)"
          ANON_KEY="$(leggi ANON_KEY)"
          SERVICE_ROLE_KEY="$(leggi SERVICE_ROLE_KEY)"
          DB_URL="$(leggi DB_URL)"
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$DB_URL" ]; then
            echo "::error::Valori mancanti da supabase status. Nomi disponibili:"
            cut -d= -f1 "$RUNNER_TEMP/supabase.env"
            exit 1
          fi
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::L'API di Supabase non è locale."; exit 1 ;;
          esac
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL_LOCALE=$DB_URL"
          } >> "$GITHUB_ENV"
          for ruolo in ADMIN MAESTRA ASSISTENTE GENITORE MAESTRA_SENZA_SEZIONE; do
            password="$(openssl rand -hex 24)"
            echo "::add-mask::$password"
            echo "E2E_${ruolo}_PASSWORD=$password" >> "$GITHUB_ENV"
          done

      - name: Build di produzione per la e2e (next build)
        run: npm run build

      - name: Test pgTAP sulle policy RLS
        run: supabase test db

      - name: Grant-check
        run: node --no-warnings --experimental-strip-types scripts/grant-check.mts

      - name: RLS-check
        run: node --no-warnings --experimental-strip-types scripts/rls-check.mts

      - name: Crea gli account di test E2E_*
        run: node scripts/crea-utenti-e2e.mjs

      - name: Test end-to-end (Playwright)
        run: npm run test:e2e

      - name: Riepilogo dei test e2e saltati (job summary)
        if: always()
        continue-on-error: true
        run: node --no-warnings --experimental-strip-types scripts/riepilogo-skip-e2e.mts >> "$GITHUB_STEP_SUMMARY"

      - name: Riepilogo dei tempi dei test e2e (job summary)
        if: always()
        continue-on-error: true
        run: node --no-warnings --experimental-strip-types scripts/riepilogo-tempi-e2e.mts >> "$GITHUB_STEP_SUMMARY"

      - name: Carica il report HTML di Playwright (anche se i test falliscono)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  verifica:
    needs: [statico, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Esito di statico ed e2e
        env:
          STATICO: ${{ needs.statico.result }}
          E2E: ${{ needs.e2e.result }}
          SERVE_E2E: ${{ needs.statico.outputs.serve-e2e }}
        run: |
          echo "statico: $STATICO — e2e: $E2E — serve-e2e: ${SERVE_E2E:-?}"
          if [ "$STATICO" != "success" ]; then
            echo "::error::Job statico: $STATICO (tsc/lint/jscpd/vitest/build)."
            exit 1
          fi
          if [ "$SERVE_E2E" = "true" ]; then
            if [ "$E2E" = "success" ]; then
              exit 0
            fi
            if [ "$E2E" = "cancelled" ]; then
              echo "::error::Job e2e cancellato (run superato da un push più recente, annullato a mano). Se non c'è un run più recente per questa PR, rilanciare con 'Re-run failed jobs' o 'gh run rerun <run-id> --failed'."
            else
              echo "::error::Job e2e: $E2E."
            fi
            exit 1
          fi
          if [ "$E2E" != "skipped" ] && [ "$E2E" != "success" ]; then
            echo "::error::Job e2e: $E2E, atteso skipped (PR non codice o Dependabot)."
            exit 1
          fi
          echo "e2e saltata di proposito (PR non codice o Dependabot)."
