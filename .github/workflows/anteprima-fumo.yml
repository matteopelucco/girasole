name: Anteprima fumo

# Giro di test di fumo sull'anteprima di Vercel (issue #267). Quando Vercel
# finisce il deploy di anteprima di una PR di questo repo, Playwright entra
# ed esce con i quattro ruoli (admin, maestra, assistente, genitore), apre le
# pagine principali, salva un avviso di prova per ruolo e lo cancella
# (e2e-anteprima/fumo.spec.ts). Scopo: accorgersi di un'anteprima rotta
# (variabili d'ambiente, build, collegamento al DB) che l'e2e di `ci.yml`,
# che gira su `next start` locale, non può vedere.
#
# NON è un check obbligatorio: non sta nel ruleset di `main` e un rosso non
# blocca nessuna PR (decisione di Matteo, issue #267). Per renderlo
# obbligatorio vedi docs/sviluppo-dettagli.md, "Giro di fumo sull'anteprima
# di Vercel". È distinto da `ci.yml` e non lo modifica.
#
# Come si rilancia: "Re-run all jobs" dalla pagina del run (Actions > Anteprima
# fumo), oppure `gh run rerun <run-id>`. A mano in locale:
# `ANTEPRIMA_URL=https://girasole-... npm run test:anteprima`.
#
# Due job, perché la guardia non deve mai finire nella coda del DB né vedere
# i secret:
#   guardia  nessun secret (solo il token del workflow, in sola lettura).
#            Controlla con `lib/guardiaAnteprima.ts` che il deploy sia
#            riuscito, in ambiente Preview, a un indirizzo di anteprima di
#            QUESTO progetto (mai la produzione `girasole.vercel.app`, mai
#            il ramo `main`, mai un altro dominio) e che il commit venga da
#            una PR dello stesso repository (nessun fork). Logica e motivi
#            dei rifiuti sono nei test unit di quel modulo. Se rifiuta, il
#            run diventa rosso con un messaggio chiaro e `fumo` non parte.
#   fumo     Parte solo dopo `guardia`. Dal passaggio dell'e2e a Supabase
#            locale (ADR-0012) è l'UNICO job che azzera il DB di test remoto
#            (`girasole_dev`): fa il reset con la Supabase CLI, ricrea gli
#            account E2E_* con la service_role e poi esegue il giro (le
#            variabili "Preview" di Vercel devono puntare a questo DB). Sta nel
#            proprio gruppo di coda `db-test-remoto-fumo` (un solo giro alla
#            volta, `cancel-in-progress: false`, `queue: max`): il reset dura
#            2-3 minuti e non si sovrappone a nessun altro reset. I secret
#            privilegiati stanno solo negli step che usano codice del ramo
#            principale, mai in quelli che eseguono codice della PR.
#
# `deployment_status` parte solo se il file del workflow esiste sul ramo
# `main`: il primo giro reale con questa versione arriva dopo il merge della
# PR che la introduce, non sulla PR stessa.
#
# Chi lavora a mano su `girasole_dev` può essere azzerato da un fumo: la coda
# vale solo tra run di CI.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  guardia:
    # Primo filtro, prima ancora di avviare una macchina: solo deploy
    # riusciti in un ambiente "Preview". La guardia li ricontrolla.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Serve a trovare la PR del commit (e da che repository arriva).
      pull-requests: read
    outputs:
      url: ${{ steps.guardia.outputs.url }}
    steps:
      # La logica della guardia viene sempre dal ramo principale, non dal
      # commit dell'anteprima: una PR non può modificare le regole con cui
      # viene giudicata.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Da quali repository vengono le PR di questo commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          # Un commit di un fork può non esistere in questo repository: l'API
          # risponde con un errore e l'elenco resta vuoto, cioè "rifiuta".
          if ! ELENCO=$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" \
                --jq '[.[] | (.head.repo.full_name // "ignoto")]' 2>/dev/null); then
            ELENCO='[]'
          fi
          echo "PR del commit, repository di partenza: ${ELENCO}"
          echo "repo-testa-pr=$(echo "${ELENCO}" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

      - name: Guardia — indirizzo, ambiente, PR dello stesso repository
        id: guardia
        env:
          REPOSITORY: ${{ github.repository }}
          STATO: ${{ github.event.deployment_status.state }}
          AMBIENTE: ${{ github.event.deployment.environment }}
          URL_ANTEPRIMA: ${{ github.event.deployment_status.environment_url }}
          REPO_TESTA_PR: ${{ steps.pr.outputs.repo-testa-pr }}
        run: node --no-warnings --experimental-strip-types scripts/guardia-anteprima.mts

  fumo:
    needs: guardia
    runs-on: ubuntu-latest
    # Esecuzione reale: reset del DB di test (~2-3 minuti) e giro di fumo.
    # L'attesa in coda non conta.
    timeout-minutes: 20
    permissions:
      contents: read
    # Gruppo di coda PROPRIO del fumo (ADR-0012, che precisa ADR-0009): il job
    # azzera il DB di test remoto, quindi due fumo non devono mai
    # sovrapporsi. Nessun altro job usa questo DB né questo nome: l'e2e di
    # `ci.yml` gira su un Supabase locale e non ha più coda. Il nome è unico
    # per tutto il repo.
    concurrency:
      group: db-test-remoto-fumo
      cancel-in-progress: false
      queue: max
    steps:
      # Il commit dell'anteprima (come fa ci.yml con la PR): i test di fumo
      # stanno al passo con l'app che provano e le migration al passo con lo
      # schema da provare. La guardia ha già verificato che il commit venga da
      # una PR di questo repository.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      # Il codice che vede i secret privilegiati (token Supabase, service_role)
      # viene dal ramo principale, non dal commit della PR, e le sue
      # dipendenze si installano senza script (`--ignore-scripts`): una PR non
      # può far girare codice suo con quei secret. Le migration e il seed
      # della PR invece sì, perché sono lo schema da provare (solo SQL, sul DB
      # di test).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: principale
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: principale/package-lock.json

      # Versione fissa: una CLI nuova potrebbe togliere flag e rompere il
      # giro all'improvviso. Si aggiorna a mano, con una PR dedicata.
      - name: Installa la Supabase CLI
        working-directory: principale
        run: npm install -g supabase@3.0.0

      # Come faceva il job e2e di ci.yml prima di ADR-0012: riapplica le
      # migration e il seed della PR sul DB di test remoto. `--remote=<ref>`
      # indica il progetto di TEST (senza, la CLI 3 lavora sul DB locale);
      # `--yes` salta la conferma, che in CI non ha nessuno a cui chiederla.
      - name: Reset del DB di test (Supabase CLI)
        id: reset-db
        run: supabase db reset --remote="$SUPABASE_TEST_PROJECT_REF" --yes
        env:
          SUPABASE_TEST_PROJECT_REF: ${{ vars.SUPABASE_TEST_PROJECT_REF }}
          # Token di accesso personale Supabase (Management API), non la
          # password del database: letto automaticamente dalla CLI.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dipendenze dello script account (senza script di installazione)
        working-directory: principale
        run: npm ci --ignore-scripts

      # Il reset azzera anche `auth.users`: gli account E2E_* si ricreano con
      # la Admin API (service_role). Gira anche se il reset fallisce a metà o
      # il run viene annullato (issue #406): il DB di test non resta mai senza
      # account. Lo script è ripetibile (crea o aggiorna).
      - name: Ricrea gli account di test E2E_* (Admin API, A24)
        if: always() && steps.reset-db.outcome != 'skipped'
        run: node principale/scripts/crea-utenti-e2e.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_MAESTRA_EMAIL: ${{ secrets.E2E_MAESTRA_EMAIL }}
          E2E_MAESTRA_PASSWORD: ${{ secrets.E2E_MAESTRA_PASSWORD }}
          E2E_ASSISTENTE_EMAIL: ${{ secrets.E2E_ASSISTENTE_EMAIL }}
          E2E_ASSISTENTE_PASSWORD: ${{ secrets.E2E_ASSISTENTE_PASSWORD }}
          E2E_GENITORE_EMAIL: ${{ secrets.E2E_GENITORE_EMAIL }}
          E2E_GENITORE_PASSWORD: ${{ secrets.E2E_GENITORE_PASSWORD }}

      # Da qui in poi gira codice del commit della PR: solo con i quattro
      # account di test, mai token Supabase né service_role (nessun secret a
      # livello di job, solo nello step del giro).
      - name: Installa le dipendenze
        run: npm ci

      - name: Installa Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Giro di fumo sull'anteprima (Playwright)
        run: npm run test:anteprima
        env:
          # Indirizzo già validato dal job `guardia`; la configurazione
          # Playwright lo ricontrolla con la stessa logica.
          ANTEPRIMA_URL: ${{ needs.guardia.outputs.url }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_MAESTRA_EMAIL: ${{ secrets.E2E_MAESTRA_EMAIL }}
          E2E_MAESTRA_PASSWORD: ${{ secrets.E2E_MAESTRA_PASSWORD }}
          E2E_ASSISTENTE_EMAIL: ${{ secrets.E2E_ASSISTENTE_EMAIL }}
          E2E_ASSISTENTE_PASSWORD: ${{ secrets.E2E_ASSISTENTE_PASSWORD }}
          E2E_GENITORE_EMAIL: ${{ secrets.E2E_GENITORE_EMAIL }}
          E2E_GENITORE_PASSWORD: ${{ secrets.E2E_GENITORE_PASSWORD }}

      - name: Carica il report HTML di Playwright (anche se i test falliscono)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anteprima-fumo-report
          path: playwright-report-anteprima/
          retention-days: 14
          if-no-files-found: ignore
