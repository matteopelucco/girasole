<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">girasole — il registro che fa crescere</title>
  <desc id="desc">Logo vettoriale di un registro elettronico per scuole dell'infanzia: un girasole, una foglia ecologica e uno smartphone.</desc>

  <defs>
